name: Compilar IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          xcodebuild build \
            -project AutoCine.xcodeproj \
            -scheme AutoCine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AutoCine.app Payload/
          zip -qr AutoCine.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AutoCine-ipa
          path: AutoCine.ipa
